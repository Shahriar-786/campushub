services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: campushub
      POSTGRES_USER: campushub
      POSTGRES_PASSWORD: campushub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campushub -d campushub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - campushub_pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://campushub:campushub@db:5432/campushub
      DJANGO_DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  campushub_pgdata:
