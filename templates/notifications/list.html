{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<h3 class="mb-3">Notifications</h3>
<div class="card p-3">
  {% for n in notifications %}
    <div class="d-flex justify-content-between align-items-center border-bottom py-2">
      <div><strong>{{ n.title }}</strong><div class="small text-muted">{{ n.body }}</div></div>
      {% if not n.is_read %}
        <form method="post" action="{% url 'notifications:mark_read' n.id %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Mark Read</button></form>
      {% else %}
        <span class="badge bg-light text-muted">Read</span>
      {% endif %}
    </div>
  {% empty %}
    <p class="text-muted mb-0">No notifications yet.</p>
  {% endfor %}
</div>
{% endblock %}
