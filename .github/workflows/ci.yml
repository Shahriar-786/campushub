name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campushub_test
          POSTGRES_USER: campushub
          POSTGRES_PASSWORD: campushub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campushub -d campushub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://campushub:campushub@localhost:5432/campushub_test
      DJANGO_SECRET_KEY: ci-only-insecure-test-key
      DJANGO_DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with Ruff
        run: ruff check .
      - name: Django system checks
        run: python manage.py check
      - name: Collect static files
        run: python manage.py collectstatic --no-input
      - name: Verify no uncreated migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run full pytest suite against PostgreSQL
        run: pytest -q
